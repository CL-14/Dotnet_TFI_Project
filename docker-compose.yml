services:
  collector:
    build: .
    # Restart after a crash and after the server reboots, unless you stopped.
    restart: unless-stopped
    # Passes the variables in .env (TFI_API_KEY) into the container.
    env_file: .env
    volumes:
      # The database folder on the server, mapped into the container, so the data survives
      # restarts and rebuilds and can be backed up
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m" # without this Docker logs grow forever
        max-file: "3"
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "5080:8080" # host port 5080, container port 8080
    environment:
      Collector__DatabasePath: /data/collector.db
      Gtfs__StopsPath: /gtfs/stops.txt
      Gtfs__RoutesPath: /gtfs/routes.txt
    volumes:
      - ./data:/data # the collector's database; the site opens it read-only
      - ./gtfs:/gtfs:ro # the two static files, mounted read-only
